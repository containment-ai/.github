#
# This repository's own config for license-headers/check_headers.py, so the
# org workflow is exercised on the repository that ships it. Licence tiers come
# from REUSE.toml, not from here.

years = "2026"
holder = "Containment.ai LLC"
default-expression = "LicenseRef-Containment-Commercial"
# Notice form on AGPL files (the checker's default, stated here explicitly).
# No file in this repository is AGPL today.
agpl-ai-use = "notice"

# The organization profile page is rendered on github.com/containment-ai and
# is annotated in REUSE.toml instead of carrying an inline header.
exempt = ["profile/**"]
